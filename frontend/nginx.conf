# Serves the SPA and proxies /api to the backend (same origin, so no CORS is needed).

# The scheme the browser used. Behind a TLS-terminating proxy (e.g. a Cloudflare Tunnel) nginx
# itself is reached over plain HTTP, so the proxy's X-Forwarded-Proto is passed on; the backend
# marks the visitor cookie Secure on HTTPS. A forged header only changes that cookie flag.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Rate limits per client IP (ADR-11.2); behind a Cloudflare Tunnel the IP comes from
# CF-Connecting-IP (see real_ip below), otherwise every visitor would share one limit.
# - expensive: starting a recommendation or a transcription (each one costs LLM calls);
# - api: everything under /api, against scripted floods.
# A request whose key is empty is not counted, so the first zone only sees those two POSTs.
map "$request_method $uri" $expensive_request_key {
    "~^POST /api/(recommendations|transcriptions)/?$" $binary_remote_addr;
    default "";
}
limit_req_zone $expensive_request_key zone=expensive:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api:2m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The visitor's IP. A Cloudflare Tunnel (cloudflared) connects from the Docker network and
    # sends the visitor's address in CF-Connecting-IP, which Cloudflare's edge always sets
    # itself. The header is trusted only from private addresses: the tunnel container, or the
    # host when the app port is bound to 127.0.0.1 (docker-compose.yml).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Voice recordings are at most 10 MB (FR-6); the backend checks the exact limit.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Errors produced by nginx itself, in the API's error shape ({"error": {"code", "message"}}),
    # so the UI shows a localized message instead of failing on an HTML page. Errors returned
    # by the backend pass through unchanged (proxy_intercept_errors is off).
    error_page 413 @upload_too_large;
    error_page 429 @rate_limited;
    error_page 502 @backend_unreachable;

    location @upload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"audio_too_large","message":"The upload is too large."}}';
    }

    # Only nginx's own limit_req rejections land here; the backend's 429 (daily limits) passes
    # through unchanged.
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Please wait a minute."}}';
    }

    location @backend_unreachable {
        default_type application/json;
        return 502 '{"error":{"code":"network_error","message":"The backend cannot be reached."}}';
    }

    location /api/ {
        # About one recommendation or recording every 10 s per IP, after a burst of 6 (a voice
        # recommendation is a transcription plus a recommendation, often re-recorded once).
        limit_req zone=expensive burst=6 nodelay;
        limit_req zone=api burst=30 nodelay;

        # Docker's DNS, re-resolved at request time: the backend keeps working for nginx after
        # its container is recreated with a new IP address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # One recommendation takes 10-40 s (several LLM calls and catalog lookups).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/history, ...) are served by index.html; it is never cached, so a new
    # build is picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
