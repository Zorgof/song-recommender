[project]
name = "song-recommender-backend"
version = "0.1.0"
description = "FastAPI backend and LangGraph agents for the Song Recommender."
readme = "README.md"
requires-python = ">=3.14.8,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
